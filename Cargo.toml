[workspace]
members = [
    "apps/cli",
    "crates/spacemind-core",
    "crates/spacemind-duplicates",
    "crates/spacemind-rules",
    "crates/spacemind-relationships",
    "crates/spacemind-scanner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.75"

[workspace.dependencies]
blake3 = "=1.5.1"
ctrlc = "=3.4.4"
clap = { version = "=4.5.4", features = ["derive"] }
crossterm = "=0.27.0"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.115"
thiserror = "=1.0.58"
unicode-width = "=0.2.0"
walkdir = "=2.5.0"
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
spacemind-core = { path = "crates/spacemind-core" }
spacemind-duplicates = { path = "crates/spacemind-duplicates" }
spacemind-rules = { path = "crates/spacemind-rules" }
spacemind-relationships = { path = "crates/spacemind-relationships" }
spacemind-scanner = { path = "crates/spacemind-scanner" }
